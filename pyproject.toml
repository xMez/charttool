[project]
name = "charttool"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15.1",
    "unidecode>=1.3.8",
    "yt-dlp>=2024.12.23",
    "platformdirs>=4.2.0",
    "requests>=2.32.4",
]

[project.scripts]
ct = "charttool.cli:app"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.8.6"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
